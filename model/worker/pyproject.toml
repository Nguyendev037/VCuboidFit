[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4"
version = "0.6.1"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "pyyaml>=6",
                "filelock>=3.13", "scikit-learn>=1.4", "joblib>=1.3", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]
gpu = ["torch>=2.4", "torchvision", "ultralytics>=8.3", "open_clip_torch>=2.26",
       "opencv-python-headless>=4.9", "pillow>=10", "filelock>=3.13"]

[tool.setuptools.packages.find]
include = ["c4*", "service*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance budget tests",
           "gpu: cần CUDA và trọng số thật (tự skip nếu thiếu)"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]
