# Model không web. Từ gốc repo:
#   $env:WORKSPACE_DIR="D:\ws"; docker compose -f model/docker/worker/docker-compose.yml up -d --build worker
#   NUSC=<nuScenes> EXP=<thí nghiệm> docker compose -f model/docker/worker/docker-compose.yml --profile gpu run --rm tier1
services:
  worker:
    image: vcuboidfit_worker:0.1
    build:
      context: ../../..
      dockerfile: model/docker/worker/Dockerfile
    environment:
      VCF_PORT: ${VCF_PORT:-${WORKER_PORT:-8001}}
      VCF_REMOTE_TOKEN: ${VCF_REMOTE_TOKEN:-}   # trống ⇒ /remote/* tắt (404); đặt ở host để Colab kéo việc
    ports:
      - "${VCF_PORT:-${WORKER_PORT:-8001}}:${VCF_PORT:-${WORKER_PORT:-8001}}"
    volumes:
      - ${WORKSPACE_DIR:?đặt WORKSPACE_DIR=<thư mục workspace>}:/data/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://127.0.0.1:%s/health' % os.environ['VCF_PORT'], timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
  tier1:          # PointPillars seed (GPU) -> t1/ ; tái dùng image vcuboidfit_pointpillars:0.1
    profiles: ["gpu"]
    image: ${VCF_TIER1_IMAGE:-vcuboidfit_pointpillars:0.1}
    shm_size: 16g
    working_dir: /work/worker
    volumes:
      - ${NUSC:-.}:/nusc:ro
      - ${EXP:-.}:/exp
      - ../../worker:/work/worker
    environment:
      PYTHONPATH: /work/worker:/opt/OpenPCDet
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    command: bash -c "python -m c4.lidar.tier1.train_seed --exp /exp --nusc /nusc --sweeps ${SWEEPS:-10} --epochs ${EPOCHS:-20} --batch ${BATCH:-8} --workers 8 && python -m c4.lidar.tier1.infer_t1 --exp /exp --batch ${BATCH:-8}"
